<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entre Páginas — Taverna do Leitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6efe1;--paper-2:#efe6d2;--ink:#28211a;--ink-soft:#5a4f3e;--ink-faint:#928570;
    --wax:#8f2d28;--wax-deep:#6f201c;--line:rgba(90,79,62,.16);--gold:#9a7b3f;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--paper);color:var(--ink);font-family:'EB Garamond',Georgia,serif;
    font-size:19px;line-height:1.75;min-height:100vh;
    background-image:radial-gradient(circle at 20% 8%, rgba(154,123,63,.05), transparent 45%),
      radial-gradient(circle at 82% 88%, rgba(143,45,40,.045), transparent 42%);}
  .wrap{max-width:900px;margin:0 auto;padding:0 26px}
  ::selection{background:rgba(143,45,40,.18)}

  .topnav{position:fixed;top:16px;right:18px;z-index:40;display:flex;gap:14px;align-items:center;
    background:rgba(246,239,225,.72);backdrop-filter:blur(5px);padding:8px 13px;border-radius:30px;border:1px solid var(--line)}
  .topnav a{display:inline-flex;color:var(--ink-soft);transition:color .2s,transform .2s}
  .topnav a:hover{color:var(--wax);transform:translateY(-1px)}
  .topnav svg{width:22px;height:22px;display:block}

  header{text-align:center;padding:60px 0 24px}
  .seal{width:120px;height:120px;margin:0 auto 20px;display:block}
  header h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(40px,8vw,60px);line-height:1;color:var(--ink)}
  .byline{font-family:'EB Garamond',serif;font-style:italic;font-size:14px;letter-spacing:.16em;color:var(--ink-faint);margin-bottom:6px;text-transform:lowercase}
  .tagline{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(19px,4vw,24px);color:var(--wax);margin-top:10px}
  .nota{max-width:480px;margin:18px auto 0;color:var(--ink-soft);font-style:italic;font-size:17px}
  .flourish{margin:28px auto 0;width:60px;height:1px;background:var(--line);position:relative}
  .flourish::after{content:"❧";position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--paper);padding:0 10px;color:var(--ink-faint);font-size:16px}

  .produtos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:26px;padding:44px 0 40px}
  .produto{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(255,255,255,.32);
    display:flex;flex-direction:column;opacity:0;transform:translateY(12px);animation:rise .6s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .foto{aspect-ratio:4/3;background:var(--paper-2);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
  .foto.sem-foto svg{width:54px;height:54px;color:var(--ink-faint);opacity:.5}
  .corpo{padding:20px 20px 18px;display:flex;flex-direction:column;flex:1;gap:14px}
  .desc{color:var(--ink-soft);line-height:1.6}
  .rodape{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
  .preco{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:25px;color:var(--ink)}
  .comprar{display:inline-flex;align-items:center;gap:7px;background:var(--wax);color:var(--paper);
    text-decoration:none;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:16px;letter-spacing:.04em;
    padding:9px 16px;border-radius:3px;transition:.2s background,.2s transform}
  .comprar:hover{background:var(--wax-deep);transform:translateY(-1px)}
  .comprar svg{width:17px;height:17px}

  .vazia{text-align:center;padding:64px 12px;color:var(--ink-faint);font-style:italic;grid-column:1/-1}
  .vazia .big{font-family:'Cormorant Garamond',serif;font-style:normal;font-size:24px;color:var(--ink-soft);margin-bottom:8px}

  footer{padding:36px 0 56px;border-top:1px solid var(--line);text-align:center;margin-top:20px}
  .social{display:flex;gap:22px;justify-content:center;margin-bottom:14px}
  .social a{display:inline-flex;align-items:center;gap:7px;color:var(--ink-soft);text-decoration:none;font-style:italic;font-size:16px;transition:color .2s}
  .social a:hover{color:var(--wax)}
  .social svg{width:20px;height:20px}
  .foot-note{color:var(--ink-faint);font-size:16px;font-style:italic}
</style>
</head>
<body>

  <nav class="topnav" aria-label="Atalhos">
    <a id="top-home" href="index.html" aria-label="Voltar ao mural" title="Voltar ao mural">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5 a2 2 0 0 1 2-2 h6 v17 h-6 a2 2 0 0 1-2-2 z"/><path d="M20 5 a2 2 0 0 0-2-2 h-6 v17 h6 a2 2 0 0 0 2-2 z"/></svg>
    </a>
    <a id="top-telegram" href="#" target="_blank" rel="noopener" aria-label="Telegram da Taverna" title="Telegram">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3c-.2-.2-.5-.3-.9-.2L3.3 11c-.5.2-.5.9 0 1.1l4.5 1.6 1.7 5.4c.1.4.6.5.9.2l2.6-2.4 4.6 3.4c.4.3.9.1 1-.4L22 4.9c.1-.2 0-.5-.1-.6zM9.4 14.2l-.3 3.3-1-3.5 8.6-5.6-7.3 5.8z"/></svg>
    </a>
    <a id="top-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram da Taverna" title="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
  </nav>

  <div class="wrap">
    <header>
      <svg class="seal" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Selo de cera">
        <defs>
          <radialGradient id="wax" cx="38%" cy="32%" r="72%"><stop offset="0%" stop-color="#c2564b"/><stop offset="48%" stop-color="#a23a32"/><stop offset="100%" stop-color="#6c1e1a"/></radialGradient>
          <g id="emblem">
            <path d="M122 56 C 108 70,92 90,80 110 L74 122 L86 116 C106 104,124 86,138 70 C134 64,128 59,122 56 Z"/>
            <path d="M120 60 L132 64 L122 72 Z"/><path d="M112 70 L125 73 L114 82 Z"/><path d="M103 81 L116 84 L105 93 Z"/>
            <path d="M80 110 L73 124 L78 121 L83 113 Z"/><circle cx="71" cy="129" r="3.4"/>
            <path d="M66 140 C84 150,116 150,138 138 C120 152,86 156,66 145 Z"/>
          </g>
        </defs>
        <path fill="url(#wax)" d="M100 18 C128 16,150 30,168 52 C184 72,186 104,176 130 C166 156,138 176,104 178 C70 180,40 166,26 138 C13 112,16 78,34 54 C50 32,72 20,100 18 Z"/>
        <circle cx="100" cy="98" r="66" fill="none" stroke="rgba(70,20,16,.45)" stroke-width="2"/>
        <use href="#emblem" fill="rgba(70,20,16,.55)" transform="translate(1.1,1.4)"/><use href="#emblem" fill="#8e2c25"/><use href="#emblem" fill="rgba(255,220,210,.30)" transform="translate(-0.8,-1)"/>
      </svg>
      <div class="byline">taverna do leitor</div>
      <h1>Entre Páginas</h1>
      <div class="tagline">pequenos tesouros para quem lê</div>
      <p class="nota">As compras são combinadas pelo Telegram — toque em comprar e fale com a gente.</p>
      <div class="flourish"></div>
    </header>

    <div class="produtos" id="produtos"></div>

    <footer>
      <div class="social">
        <a id="a-telegram" href="#" target="_blank" rel="noopener" aria-label="Telegram da Taverna">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.9 4.3c-.2-.2-.5-.3-.9-.2L3.3 11c-.5.2-.5.9 0 1.1l4.5 1.6 1.7 5.4c.1.4.6.5.9.2l2.6-2.4 4.6 3.4c.4.3.9.1 1-.4L22 4.9c.1-.2 0-.5-.1-.6zM9.4 14.2l-.3 3.3-1-3.5 8.6-5.6-7.3 5.8z"/></svg>
          Telegram
        </a>
        <a id="a-instagram" href="#" target="_blank" rel="noopener" aria-label="Instagram da Taverna">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="currentColor" stroke="none"/></svg>
          Instagram
        </a>
      </div>
      <div class="foot-note">Cada peça nasce do mesmo amor pelas histórias.</div>
    </footer>
  </div>

<script>
  // ===== Supabase (mesmo projeto do site) =====
  var SUPABASE_URL = 'https://mowrcqwxtmjuqtxbesfg.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_gSMSa-F4C1FHkEpz1QHN3w_pIQ3epsc';
  var REST = SUPABASE_URL + '/rest/v1';
  var HEADERS = { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY };

  // ===== Telegram para onde vão as compras (troque pelo seu contato) =====
  var TELEGRAM_LOJA = 'https://t.me/+xsUch4Uybjg4ZmMx';

  // ===== Links da barra de ícones (troque pelos seus) =====
  var LINKS = {
    telegram: 'https://t.me/+xsUch4Uybjg4ZmMx',
    instagram: 'https://www.instagram.com/atavernadoleitor/L'
  };

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  document.getElementById('a-telegram').href = LINKS.telegram;
  document.getElementById('a-instagram').href = LINKS.instagram;
  document.getElementById('top-telegram').href = LINKS.telegram;
  document.getElementById('top-instagram').href = LINKS.instagram;

  var emblemaSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 5 a2 2 0 0 1 2-2 h6 v16 h-6 a2 2 0 0 1-2-2 z"/><path d="M20 5 a2 2 0 0 0-2-2 h-6 v16 h6 a2 2 0 0 0 2-2 z"/></svg>';
  var carrinhoSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/><path d="M3 4 h2 l2.2 11 h11 l1.8-8 h-15"/></svg>';

  async function supaGet(path){
    var res = await fetch(REST + path, { headers: HEADERS });
    if(!res.ok) throw new Error('HTTP ' + res.status + ' ' + (await res.text()));
    return res.json();
  }

  async function carregar(){
    var box = document.getElementById('produtos');
    box.innerHTML = '<div class="vazia"><div class="big">A abrir a loja…</div></div>';
    try{
      var rows = await supaGet('/produtos?ativo=eq.true&select=foto,descricao,preco,link,ordem,criado_em&order=ordem.asc,criado_em.desc');
      render(rows);
    }catch(e){
      console.error('Falha ao carregar produtos:', e);
      box.innerHTML = '<div class="vazia"><div class="big">A loja está fechada</div>Não consegui carregar os produtos. Veja o console (F12).</div>';
    }
  }

  function render(lista){
    var box = document.getElementById('produtos');
    if(!lista.length){
      box.innerHTML = '<div class="vazia"><div class="big">A loja abre em breve</div>As primeiras peças estão a caminho.</div>';
      return;
    }
    box.innerHTML = '';
    lista.forEach(function(p,i){
      var link = p.link || TELEGRAM_LOJA;
      var card = document.createElement('div');
      card.className = 'produto';
      card.style.animationDelay = (i*0.06)+'s';
      var foto = p.foto
        ? '<div class="foto" style="background-image:url(\''+p.foto+'\')"></div>'
        : '<div class="foto sem-foto">'+emblemaSVG+'</div>';
      card.innerHTML =
        foto +
        '<div class="corpo">'+
          '<div class="desc">'+esc(p.descricao)+'</div>'+
          '<div class="rodape">'+
            '<span class="preco">'+esc(p.preco)+'</span>'+
            '<a class="comprar" href="'+link+'" target="_blank" rel="noopener" aria-label="Comprar pelo Telegram">'+carrinhoSVG+' Comprar</a>'+
          '</div>'+
        '</div>';
      box.appendChild(card);
    });
  }

  carregar();
</script>
</body>
</html>
